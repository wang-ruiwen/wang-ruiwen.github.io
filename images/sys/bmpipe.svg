<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 144" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#6c5ce7"/>
<stop offset="100%" stop-color="#4834a8"/>
</linearGradient>
</defs>
<rect width="200" height="144" fill="url(#bg)"/>
<!-- Pipeline body (horizontal capsule) -->
<rect x="18" y="50" width="164" height="44" rx="22" fill="rgba(255,255,255,0.10)" stroke="#fff" stroke-width="3"/>
<!-- Inner highlight stripe -->
<rect x="22" y="54" width="156" height="6" rx="3" fill="rgba(255,255,255,0.25)"/>
<!-- Bubbles inside pipe -->
<circle cx="48" cy="72" r="9" fill="#fff" opacity="0.95"/>
<circle cx="80" cy="68" r="6" fill="#fff" opacity="0.75"/>
<circle cx="110" cy="76" r="7" fill="#fff" opacity="0.88"/>
<circle cx="140" cy="70" r="8" fill="#fff" opacity="0.92"/>
<circle cx="165" cy="74" r="5" fill="#fff" opacity="0.7"/>
<!-- Flow arrow on right -->
<polygon points="186,72 178,66 178,78" fill="#fff" opacity="0.85"/>
</svg>
