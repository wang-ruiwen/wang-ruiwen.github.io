<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 144" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="mg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#f39c12"/>
<stop offset="100%" stop-color="#c87f0a"/>
</linearGradient>
</defs>
<rect width="200" height="144" fill="url(#mg)"/>
<!-- Drop shadow under pin -->
<ellipse cx="100" cy="125" rx="22" ry="4" fill="rgba(0,0,0,0.25)"/>
<!-- Pushpin head: rounded body -->
<ellipse cx="100" cy="48" rx="34" ry="22" fill="#fff"/>
<!-- Highlight on head -->
<ellipse cx="92" cy="42" rx="14" ry="7" fill="rgba(255,255,255,0.95)" opacity="0.4"/>
<ellipse cx="92" cy="42" rx="8" ry="3" fill="#fff" opacity="0.85"/>
<!-- Pin shaft (triangular) -->
<polygon points="88,68 112,68 102,118" fill="#fff"/>
<polygon points="88,68 100,68 100,118" fill="rgba(0,0,0,0.06)"/>
<!-- Pin tip -->
<line x1="102" y1="118" x2="102" y2="124" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
</svg>
