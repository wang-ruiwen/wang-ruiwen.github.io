<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 144" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#00b894"/>
<stop offset="100%" stop-color="#008a6f"/>
</linearGradient>
</defs>
<rect width="200" height="144" fill="url(#hg)"/>
<!-- Bond lines (drawn first, behind atoms) -->
<line x1="68" y1="98" x2="92" y2="62" stroke="#fff" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
<line x1="132" y1="98" x2="108" y2="62" stroke="#fff" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
<!-- Oxygen atom (top, larger) -->
<circle cx="100" cy="48" r="24" fill="#fff"/>
<text x="100" y="56" font-family="Ubuntu,'Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#008a6f" text-anchor="middle">O</text>
<!-- Hydrogen atoms (bottom-left and bottom-right) -->
<circle cx="60" cy="105" r="17" fill="#fff"/>
<text x="60" y="111" font-family="Ubuntu,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#008a6f" text-anchor="middle">H</text>
<circle cx="140" cy="105" r="17" fill="#fff"/>
<text x="140" y="111" font-family="Ubuntu,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#008a6f" text-anchor="middle">H</text>
</svg>
