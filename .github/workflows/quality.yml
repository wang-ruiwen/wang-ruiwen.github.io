name: Quality CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  html:
    name: HTML · structure (W3C Nu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install -q html5validator
      # The bundled vnu predates some of our CSS/HTML: filter its false
      # "property doesn't exist" CSS noise and the media=/fetchpriority
      # attributes it doesn't know yet. Real HTML structure errors
      # (bad nesting, duplicate ids, unclosed tags) still fail the build.
      - run: >-
          html5validator --root . --match "*.html"
          --ignore-re 'Property "[^"]*" doesn.t exist'
          'Attribute "(media|fetchpriority)" not allowed'

  links:
    name: Links · lychee
    runs-on: ubuntu-latest
    continue-on-error: true   # external academic sites are flaky in CI
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --timeout 20
            --max-retries 3
            '**/*.html'
          fail: false

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.js
          uploadArtifacts: true
          temporaryPublicStorage: true
