<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fafafa">
<title>404 — Ruiwen WANG</title>
<link rel="icon" type="image/png" sizes="256x256" href="/img/favicon.png?v=2">
<link rel="icon" type="image/svg+xml" href="/img/favicon.svg?v=2">
<style>
:root{--rw-accent:#4b81e8;--rw-accent-dark:#2c5dbf;--rw-text:#1a1f36;--rw-text-muted:#5a667a;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:2rem;
  text-align:center;
  background:#fafafa;
  color:var(--rw-text);
  font-family:'Source Serif 4',Charter,'Iowan Old Style',Georgia,'Times New Roman',serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
.rw-404-code{
  font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:4.5rem;
  font-weight:800;
  letter-spacing:-0.03em;
  color:var(--rw-accent-dark);
  line-height:1;
  margin:0;
}
.rw-404-title{
  font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:1.25rem;
  font-weight:600;
  margin:1rem 0 0.5rem;
}
.rw-404-text{
  color:var(--rw-text-muted);
  font-size:1rem;
  line-height:1.6;
  margin:0 0 1.75rem;
  max-width:32rem;
}
.rw-404-home{
  font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  display:inline-block;
  font-size:0.95rem;
  font-weight:600;
  color:#fff;
  background:var(--rw-accent);
  text-decoration:none;
  padding:0.6rem 1.3rem;
  border-radius:999px;
  transition:background 0.2s ease;
}
.rw-404-home:hover{background:var(--rw-accent-dark);}
</style>
</head>
<body>
<p class="rw-404-code">404</p>
<h1 class="rw-404-title">Page not found</h1>
<p class="rw-404-text">This page doesn’t exist or has moved. Everything now lives on the homepage.</p>
<a class="rw-404-home" href="/">← Back to homepage</a>
</body>
</html>
