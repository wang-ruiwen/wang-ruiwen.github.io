<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fffff8" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#1e1e1a" media="(prefers-color-scheme:dark)">
<title>404 — Ruiwen WANG</title>
<link rel="icon" type="image/png" sizes="256x256" href="/img/favicon.png?v=3">
<link rel="icon" type="image/svg+xml" href="/img/favicon.svg?v=3">
<style>
@font-face{font-family:'Source Serif 4';font-style:normal;font-weight:400 700;font-display:swap;src:url('/fonts/source-serif-4-latin-wght-normal.woff2') format('woff2');}
@font-face{font-family:'Source Serif 4';font-style:italic;font-weight:400 700;font-display:swap;src:url('/fonts/source-serif-4-latin-wght-italic.woff2') format('woff2');}
:root{
  --bg:#fffff8;--ink:#1a1a18;--muted:#5a5a50;--soft:#73735f;
  --line:rgba(175,170,148,0.32);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1e1e1a;--ink:#f0efe8;--muted:#d4d2c8;--soft:#8a8a7e;
    --line:rgba(175,170,148,0.18);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:2rem;
  text-align:center;
  background:var(--bg);
  color:var(--ink);
  font-family:'Source Serif 4',Palatino,'Iowan Old Style',Georgia,serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
.rw-404-code{
  font-size:3.6rem;
  font-weight:400;
  font-style:italic;
  color:var(--soft);
  line-height:1;
  margin:0;
  font-variant-numeric:oldstyle-nums;
}
.rw-404-title{
  font-size:1.35rem;
  font-weight:400;
  font-style:italic;
  margin:1rem 0 0.5rem;
}
.rw-404-text{
  color:var(--muted);
  font-size:1rem;
  line-height:1.7;
  margin:0 0 1.6rem;
  max-width:32rem;
}
.rw-404-home{
  font-size:1rem;
  color:var(--ink);
  text-decoration:none;
  border-bottom:1px solid var(--line);
  transition:border-color 0.2s ease;
  padding-bottom:1px;
}
.rw-404-home:hover{border-bottom-color:var(--muted);}
</style>
</head>
<body>
<p class="rw-404-code">404</p>
<h1 class="rw-404-title">Page not found</h1>
<p class="rw-404-text">This page doesn’t exist or has moved. Everything now lives on the homepage.</p>
<a class="rw-404-home" href="/">← Back to homepage</a>
</body>
</html>
